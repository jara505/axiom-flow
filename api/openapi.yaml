openapi: 3.0.0
info:
  title: Axiom Flow API
  description: Sistema de procesamiento de pedidos con transacciones distribuidas basadas en el patrón Saga.
  version: 1.0.0
servers:
  - url: http://localhost:8080
    description: Monolito principal (Saga orchestrator)
  - url: http://localhost:8081
    description: Servicio de envíos
  - url: http://localhost:8082
    description: Servicio de inventario
tags:
  - name: orders
    description: Operaciones de órdenes y Saga
  - name: inventory
    description: Operaciones de inventario
  - name: shipment
    description: Operaciones de envíos
  - name: health
    description: Health checks
paths:
  /orders:
    post:
      summary: Crear orden e iniciar Saga
      tags: [orders]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
            example:
              customer_id: cust-001
              order_number: ORD-2026-0001
              total: 99.99
              product_id: prod-001
              quantity: 2
              idempotency_key: idem-key-abc123
      responses:
        '201':
          description: Orden creada y Saga iniciada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
              example:
                order_id: ord-11111111-1111-1111-1111-111111111111
                order_number: ORD-2026-0001
                status: PENDING
                saga_status: STARTED
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /orders/{id}/saga:
    get:
      summary: Consultar pasos de la Saga
      tags: [orders]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          example: ord-11111111-1111-1111-1111-111111111111
      responses:
        '200':
          description: Pasos de la Saga consultados
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SagaResponse'
              example:
                order_id: ord-11111111-1111-1111-1111-111111111111
                status: COMPLETED
                steps:
                  - step: RESERVE_INVENTORY
                    status: COMPLETED
                    timestamp: '2026-11-18T04:00:00Z'
                  - step: PROCESS_PAYMENT
                    status: COMPLETED
                    timestamp: '2026-11-18T04:00:05Z'
                  - step: CREATE_SHIPMENT
                    status: COMPLETED
                    timestamp: '2026-11-18T04:00:10Z'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /inventory/reserve:
    post:
      summary: Reservar inventario
      tags: [inventory]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReserveRequest'
            example:
              order_id: ord-11111111-1111-1111-1111-111111111111
              product_id: prod-001
              quantity: 2
              idempotency_key: idem-key-reserve-123
      responses:
        '200':
          description: Inventario reservado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReserveResponse'
              example:
                reservation_id: res-22222222-2222-2222-2222-222222222222
                order_id: ord-11111111-1111-1111-1111-111111111111
                product_id: prod-001
                quantity: 2
                status: RESERVED
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /inventory/release:
    post:
      summary: Liberar reserva (compensación)
      tags: [inventory]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReleaseRequest'
            example:
              order_id: ord-11111111-1111-1111-1111-111111111111
              product_id: prod-001
              idempotency_key: idem-key-release-123
      responses:
        '200':
          description: Reserva liberada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReleaseResponse'
              example:
                order_id: ord-11111111-1111-1111-1111-111111111111
                product_id: prod-001
                status: RELEASED
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /shipments:
    post:
      summary: Crear envío
      tags: [shipment]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateShipmentRequest'
            example:
              order_id: ord-11111111-1111-1111-1111-111111111111
              address: Av. Siempre Viva 123, Springfield
              method: STANDARD
              idempotency_key: idem-key-shipment-123
      responses:
        '201':
          description: Envío creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShipmentResponse'
              example:
                shipment_id: shp-33333333-3333-3333-3333-333333333333
                order_id: ord-11111111-1111-1111-1111-111111111111
                status: CREATED
                address: Av. Siempre Viva 123, Springfield
                method: STANDARD
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /envíos/{order_id}:
    get:
      summary: Consultar envío por orden
      tags: [shipment]
      parameters:
        - in: path
          name: order_id
          required: true
          schema:
            type: string
          example: ord-11111111-1111-1111-1111-111111111111
      responses:
        '200':
          description: Envío encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Shipment'
              example:
                shipment_id: shp-33333333-3333-3333-3333-333333333333
                order_id: ord-11111111-1111-1111-1111-111111111111
                status: DELIVERED
                address: Av. Siempre Viva 123, Springfield
                method: STANDARD
                created_at: '2026-11-18T04:00:10Z'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /health:
    get:
      summary: Health check
      tags: [health]
      responses:
        '200':
          description: Servicio saludable
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  service:
                    type: string
                    example: axiom-flow-monolith
                  timestamp:
                    type: string
                    format: date-time
                    example: '2026-11-18T04:00:00Z'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
components:
  schemas:
    CreateOrderRequest:
      type: object
      required: [customer_id, order_number, total, product_id, quantity]
      properties:
        customer_id:
          type: string
          example: cust-001
        order_number:
          type: string
          example: ORD-2026-0001
        total:
          type: number
          format: float
          example: 99.99
        product_id:
          type: string
          example: prod-001
        quantity:
          type: integer
          example: 2
        idempotency_key:
          type: string
          example: idem-key-abc123
    OrderResponse:
      type: object
      required: [order_id, order_number, status, saga_status]
      properties:
        order_id:
          type: string
          example: ord-11111111-1111-1111-1111-111111111111
        order_number:
          type: string
          example: ORD-2026-0001
        status:
          type: string
          example: PENDING
        saga_status:
          type: string
          example: STARTED
    SagaResponse:
      type: object
      required: [order_id, status, steps]
      properties:
        order_id:
          type: string
          example: ord-11111111-1111-1111-1111-111111111111
        status:
          type: string
          example: COMPLETED
        steps:
          type: array
          items:
            $ref: '#/components/schemas/SagaStepResponse'
    SagaStepResponse:
      type: object
      required: [step, status, timestamp]
      properties:
        step:
          type: string
          example: RESERVE_INVENTORY
        status:
          type: string
          example: COMPLETED
        timestamp:
          type: string
          format: date-time
          example: '2026-11-18T04:00:00Z'
    ErrorResponse:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          example: VALIDATION_ERROR
        message:
          type: string
          example: El campo total es obligatorio y debe ser mayor que 0
        details:
          type: object
          example: {}
    ReserveRequest:
      type: object
      required: [order_id, product_id, quantity]
      properties:
        order_id:
          type: string
          example: ord-11111111-1111-1111-1111-111111111111
        product_id:
          type: string
          example: prod-001
        quantity:
          type: integer
          example: 2
        idempotency_key:
          type: string
          example: idem-key-reserve-123
    ReserveResponse:
      type: object
      required: [reservation_id, order_id, product_id, quantity, status]
      properties:
        reservation_id:
          type: string
          example: res-22222222-2222-2222-2222-222222222222
        order_id:
          type: string
          example: ord-11111111-1111-1111-1111-111111111111
        product_id:
          type: string
          example: prod-001
        quantity:
          type: integer
          example: 2
        status:
          type: string
          example: RESERVED
    ReleaseRequest:
      type: object
      required: [order_id, product_id]
      properties:
        order_id:
          type: string
          example: ord-11111111-1111-1111-1111-111111111111
        product_id:
          type: string
          example: prod-001
        idempotency_key:
          type: string
          example: idem-key-release-123
    ReleaseResponse:
      type: object
      required: [order_id, product_id, status]
      properties:
        order_id:
          type: string
          example: ord-11111111-1111-1111-1111-111111111111
        product_id:
          type: string
          example: prod-001
        status:
          type: string
          example: RELEASED
    CreateShipmentRequest:
      type: object
      required: [order_id, address]
      properties:
        order_id:
          type: string
          example: ord-11111111-1111-1111-1111-111111111111
        address:
          type: string
          example: Av. Siempre Viva 123, Springfield
        method:
          type: string
          example: STANDARD
        idempotency_key:
          type: string
          example: idem-key-shipment-123
    ShipmentResponse:
      type: object
      required: [shipment_id, order_id, status]
      properties:
        shipment_id:
          type: string
          example: shp-33333333-3333-3333-3333-333333333333
        order_id:
          type: string
          example: ord-11111111-1111-1111-1111-111111111111
        status:
          type: string
          example: CREATED
        address:
          type: string
          example: Av. Siempre Viva 123, Springfield
        method:
          type: string
          example: STANDARD
    Shipment:
      type: object
      required: [shipment_id, order_id, status, address, method, created_at]
      properties:
        shipment_id:
          type: string
          example: shp-33333333-3333-3333-3333-333333333333
        order_id:
          type: string
          example: ord-11111111-1111-1111-1111-111111111111
        status:
          type: string
          example: DELIVERED
        address:
          type: string
          example: Av. Siempre Viva 123, Springfield
        method:
          type: string
          example: STANDARD
        created_at:
          type: string
          format: date-time
          example: '2026-11-18T04:00:10Z'
  responses:
    BadRequest:
      description: Solicitud inválida
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: BAD_REQUEST
            message: Cuerpo de la solicitud inválido
    NotFound:
      description: Recurso no encontrado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: NOT_FOUND
            message: Recurso no encontrado
    Conflict:
      description: Conflicto (idempotencia o estado inválido)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: CONFLICT
            message: La orden ya existe o el idempotency_key ya fue usado
    InternalServerError:
      description: Error interno del servidor
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: INTERNAL_SERVER_ERROR
            message: Error interno del servidor
    ServiceUnavailable:
      description: Servicio no disponible
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: SERVICE_UNAVAILABLE
            message: Servicio temporalmente no disponible
